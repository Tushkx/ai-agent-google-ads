services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - agent-state:/app/data/state
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - agent-state:/app/data/state
    depends_on:
      - api
    restart: unless-stopped

  scheduler:
    build: .
    command: python scheduler.py
    env_file: .env
    volumes:
      - agent-state:/app/data/state
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - scheduler

volumes:
  agent-state:
